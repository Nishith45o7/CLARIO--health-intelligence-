<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CLARIO workflow</title>
  <desc id="d">Patient intake, input validation, structured case creation, summary and missing-information review, doctor dashboard, case status update.</desc>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .arrow{stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-26}}
    .box{animation:glow 9s ease-in-out infinite}
    @keyframes glow{0%,100%{fill:#F7F9F7}6%,14%{fill:#D7F3E8}20%{fill:#F7F9F7}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="220" rx="16" fill="#FFFFFF" stroke="#123B3A" stroke-opacity=".15"/>
  <g stroke="#123B3A" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path class="arrow" d="M178 110H208"/><path class="arrow" d="M368 110H398"/>
    <path class="arrow" d="M558 110H588"/><path class="arrow" d="M748 110H778"/>
    <path class="arrow" d="M938 110H968"/>
  </g>
  <g stroke="#123B3A" stroke-width="2" rx="12">
    <rect class="box" x="30" y="60" width="148" height="100" rx="12"/>
    <rect class="box" style="animation-delay:1.5s" x="208" y="60" width="160" height="100" rx="12"/>
    <rect class="box" style="animation-delay:3s" x="398" y="60" width="160" height="100" rx="12"/>
    <rect class="box" style="animation-delay:4.5s" x="588" y="60" width="160" height="100" rx="12"/>
    <rect class="box" style="animation-delay:6s" x="778" y="60" width="160" height="100" rx="12"/>
    <rect class="box" style="animation-delay:7.5s" x="968" y="60" width="172" height="100" rx="12"/>
  </g>
  <g fill="#123B3A" text-anchor="middle" font-size="16" font-weight="600">
    <text x="104" y="105">Patient</text><text x="104" y="127">intake</text>
    <text x="288" y="105">Input</text><text x="288" y="127">validation</text>
    <text x="478" y="105">Structured</text><text x="478" y="127">case creation</text>
    <text x="668" y="105">Summary +</text><text x="668" y="127">missing info</text>
    <text x="858" y="105">Doctor</text><text x="858" y="127">dashboard</text>
    <text x="1054" y="105">Case status</text><text x="1054" y="127">update</text>
  </g>
</svg>
