<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .l{stroke-dasharray:14 10;animation:d 2s linear infinite}
