<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CLARIO — Health Intelligence</title>
  <desc id="d">Animated pathway: a patient story flows through six workflow stages into a structured case summary.</desc>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:10 12;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-44}}
    .node{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}8%,16%{opacity:1;transform:scale(1.25)}24%{opacity:.55;transform:scale(1)}}
    .scribble{stroke-dasharray:6 7;animation:dash 3s linear infinite}
    .fade{animation:fade 6s ease-in-out infinite}
    @keyframes fade{0%,100%{opacity:.7}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B3A"/><stop offset="1" stop-color="#0D2D2C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <g opacity=".07" stroke="#D7F3E8">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
  </g>

  <text x="600" y="120" text-anchor="middle" font-size="68" font-weight="700" letter-spacing="18" fill="#FFFFFF">CLARIO</text>
  <text x="600" y="156" text-anchor="middle" font-size="18" letter-spacing="8" fill="#D7F3E8">HEALTH INTELLIGENCE</text>
  <text x="600" y="206" text-anchor="middle" font-size="24" fill="#FFFFFF" class="fade">From patient stories to clinical clarity.</text>

  <!-- patient narrative (unstructured) -->
  <g stroke="#D7F3E8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8">
    <path class="scribble" d="M70 300 q15 -14 30 0 t30 0 t30 0"/>
    <path class="scribble" d="M70 325 q15 -14 30 0 t30 0 t18 0"/>
    <path class="scribble" d="M70 350 q15 -14 30 0 t30 0"/>
  </g>
  <text x="115" y="385" text-anchor="middle" font-size="13" fill="#D7F3E8">Patient story</text>

  <!-- pathway -->
  <path id="p" d="M200 325H1000" stroke="#D7F3E8" stroke-width="3" fill="none" opacity=".25"/>
  <path class="flow" d="M200 325H1000" stroke="#D7F3E8" stroke-width="3" fill="none"/>

  <g font-size="13" fill="#D7F3E8" text-anchor="middle">
    <circle class="node" cx="260" cy="325" r="11" fill="#D7F3E8"/><text x="260" y="360">Intake</text>
    <circle class="node" style="animation-delay:1s" cx="400" cy="325" r="11" fill="#D7F3E8"/><text x="400" y="360">Validate</text>
    <circle class="node" style="animation-delay:2s" cx="540" cy="325" r="11" fill="#D7F3E8"/><text x="540" y="360">Structure</text>
    <circle class="node" style="animation-delay:3s" cx="680" cy="325" r="11" fill="#D7F3E8"/><text x="680" y="360">Review</text>
    <circle class="node" style="animation-delay:4s" cx="820" cy="325" r="11" fill="#D7F3E8"/><text x="820" y="360">Dashboard</text>
    <circle class="node" style="animation-delay:5s" cx="960" cy="325" r="11" fill="#D7F3E8"/><text x="960" y="360">Status</text>
  </g>

  <circle r="6" fill="#FFFFFF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M200 325H1000"/>
  </circle>

  <!-- structured case card -->
  <g>
    <rect x="1040" y="272" width="100" height="106" rx="10" fill="#F7F9F7"/>
    <rect x="1054" y="288" width="48" height="7" rx="3" fill="#123B3A"/>
    <rect x="1054" y="305" width="72" height="5" rx="2" fill="#D7F3E8"/>
    <rect x="1054" y="318" width="64" height="5" rx="2" fill="#D7F3E8"/>
    <rect x="1054" y="331" width="70" height="5" rx="2" fill="#D7F3E8"/>
    <path d="M1056 355l7 7 14-15" stroke="#123B3A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" class="fade"/>
  </g>
  <text x="1090" y="400" text-anchor="middle" font-size="13" fill="#D7F3E8">Review-ready case</text>
</svg>
